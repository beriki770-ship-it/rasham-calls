name: Build APK

# Builds an installable debug APK in the cloud (no local Android toolchain needed).
# The scrcpy-server asset is downloaded by the Gradle build at build time, so the
# runner needs network access — GitHub-hosted runners have it.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK 36 platform + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        # SKIP_SIGNING bypasses the fork's CI release-keystore requirement. Debug
        # builds use the default debug key and are installable regardless.
        env:
          SKIP_SIGNING: "true"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rasham-calls-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
